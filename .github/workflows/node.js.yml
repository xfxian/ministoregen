name: ministoregen

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Previews show which pull request they come from; other builds
          # fall back to `git describe`. Releases are stamped by release.yml.
          APP_VERSION: ${{ github.event_name == 'pull_request' && format('preview-pr{0}', github.event.number) || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.event_name == 'pull_request'
    concurrency:
      group: pages-pr-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
